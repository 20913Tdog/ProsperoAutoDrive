name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    name: guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: No binaries or large files in git
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            # Submodules (third_party/) appear as empty directories here.
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            if [ "$size" -gt 1048576 ]; then
              echo "::error file=$f::larger than 1 MiB ($size bytes) - publish via the dev pre-release instead"
              fail=1
            fi
            [ "$size" -eq 0 ] && continue
            case "$f" in
              *.png|*.ico) continue ;;
            esac
            if [ "$(file -b --mime-encoding "$f")" = "binary" ]; then
              echo "::error file=$f::binary file - build outputs belong in the dev pre-release, not in git"
              fail=1
            fi
          done < <(git ls-files -z)
          exit $fail

  # Same pinned toolchain as local development: llvm-mingw (clang) for PS5 and
  # Windows targets, ps5-payload-sdk for the PS5 sysroot.
  ps5-build:
    name: ps5-build
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20260922"
      LLVM_MINGW_SHA256: bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21
      SDK_VERSION: v0.44
      SDK_SHA256: 4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains
          key: toolchains-llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ps5sdk-${{ env.SDK_VERSION }}

      - name: Download toolchains (pinned versions and hashes)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/toolchains && cd ~/toolchains
          curl -fsSL -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          echo "${LLVM_MINGW_SHA256}  llvm-mingw.tar.xz" | sha256sum -c -
          mkdir llvm-mingw
          tar -xJf llvm-mingw.tar.xz -C llvm-mingw --strip-components=1
          rm llvm-mingw.tar.xz
          curl -fsSL -o ps5-payload-sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          echo "${SDK_SHA256}  ps5-payload-sdk.zip" | sha256sum -c -
          unzip -q ps5-payload-sdk.zip
          rm ps5-payload-sdk.zip

      - name: Toolchain environment
        run: |
          set -euo pipefail
          sudo apt-get install -y -q ninja-build
          T="$HOME/toolchains"
          # The SDK's prospero-lld asks llvm-config where ld.lld lives;
          # llvm-mingw ships no llvm-config, so provide a minimal one.
          mkdir -p "$T/shim"
          cat > "$T/shim/llvm-config" <<EOF
          #!/bin/sh
          case "\$1" in
            --bindir) echo "$T/llvm-mingw/bin" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "$T/shim/llvm-config"
          {
            echo "LLVM_ROOT=$T/llvm-mingw"
            echo "PS5_PAYLOAD_SDK=$T/ps5-payload-sdk"
            echo "LLVM_CONFIG=$T/shim/llvm-config"
          } >> "$GITHUB_ENV"

      - name: Build PS5 payloads
        shell: bash
        run: |
          { cmake --preset ps5 && cmake --build --preset ps5; } 2>&1 | tee -a ci.log

      - name: Failure details as annotation (readable without login)
        if: failure()
        run: bash .github/scripts/annotate-tail.sh ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: ps5-payloads
          path: build/ps5/bin/*.elf
          if-no-files-found: error

  ps5-host-test:
    name: ps5-host-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build host variant of the PS5 code
        shell: bash
        run: |
          {
            sudo apt-get update -q &&
            sudo apt-get install -y -q ninja-build smbclient &&
            cmake --preset host &&
            cmake --build --preset host
          } 2>&1 | tee -a ci.log

      - name: S1 probe behaviour (E1)
        shell: bash
        run: bash tests/spikes/s1-host-test.sh build/host/bin/s1-portprobe 2>&1 | tee -a ci.log

      - name: S2 SMB server against smbclient (E1)
        shell: bash
        run: bash tests/spikes/s2-host-test.sh build/host/bin/s2-smbserver 2>&1 | tee -a ci.log

      - name: Failure details as annotation (readable without login)
        if: failure()
        run: bash .github/scripts/annotate-tail.sh ci.log

  publish-dev:
    name: publish-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [guards, ps5-build, ps5-host-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ps5-payloads
          path: dist

      - name: Build info and checksums
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "run=${GITHUB_RUN_ID}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD-INFO.txt
          cd dist
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat BUILD-INFO.txt SHA256SUMS

      # Tag and release are named dev-build, not dev: a tag "dev" next to the
      # branch "dev" would make the name ambiguous in git.
      - name: Replace pre-release "dev-build"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build dist/* \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "dev $(git rev-parse --short HEAD)" \
            --notes "Automatischer, getesteter Build des dev-Branches. Nicht fuer den produktiven Einsatz. Commit ${GITHUB_SHA}"

      # The owner fetches the build anonymously, so check exactly that. Once
      # (run for b13868b) the step succeeded, the tag moved, and the release
      # still stayed invisible, so a draft is published here and reported.
      - name: Check dev-build is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! state=$(gh release view dev-build --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'); then
            echo "::error title=dev-build::release dev-build not found after creating it"
            exit 1
          fi
          echo "::notice title=dev-build::${state}"
          case "$state" in
            draft=true*) gh release edit dev-build --draft=false --prerelease ;;
          esac
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-build/BUILD-INFO.txt"
          for i in $(seq 18); do
            if curl -fsSL "$url" 2>/dev/null | grep -qx "commit=${GITHUB_SHA}"; then
              echo "public download OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=dev-build::BUILD-INFO.txt is not publicly downloadable for ${GITHUB_SHA}"
          exit 1
