name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    name: guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: No binaries or large files in git
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            # Submodules (third_party/) appear as empty directories here.
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            if [ "$size" -gt 1048576 ]; then
              echo "::error file=$f::larger than 1 MiB ($size bytes) - publish via the dev pre-release instead"
              fail=1
            fi
            [ "$size" -eq 0 ] && continue
            case "$f" in
              *.png|*.ico) continue ;;
            esac
            if [ "$(file -b --mime-encoding "$f")" = "binary" ]; then
              echo "::error file=$f::binary file - build outputs belong in the dev pre-release, not in git"
              fail=1
            fi
          done < <(git ls-files -z)
          exit $fail

  # Same pinned toolchain as local development: llvm-mingw (clang) for PS5 and
  # Windows targets, ps5-payload-sdk for the PS5 sysroot.
  ps5-build:
    name: ps5-build
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20260922"
      LLVM_MINGW_SHA256: bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21
      SDK_VERSION: v0.44
      SDK_SHA256: 4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains
          key: toolchains-llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ps5sdk-${{ env.SDK_VERSION }}

      - name: Download toolchains (pinned versions and hashes)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/toolchains && cd ~/toolchains
          curl -fsSL -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          echo "${LLVM_MINGW_SHA256}  llvm-mingw.tar.xz" | sha256sum -c -
          mkdir llvm-mingw
          tar -xJf llvm-mingw.tar.xz -C llvm-mingw --strip-components=1
          rm llvm-mingw.tar.xz
          curl -fsSL -o ps5-payload-sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          echo "${SDK_SHA256}  ps5-payload-sdk.zip" | sha256sum -c -
          unzip -q ps5-payload-sdk.zip
          rm ps5-payload-sdk.zip

      - name: Toolchain environment
        run: |
          set -euo pipefail
          sudo apt-get install -y -q ninja-build
          T="$HOME/toolchains"
          # The SDK's prospero-lld asks llvm-config where ld.lld lives;
          # llvm-mingw ships no llvm-config, so provide a minimal one.
          mkdir -p "$T/shim"
          cat > "$T/shim/llvm-config" <<EOF
          #!/bin/sh
          case "\$1" in
            --bindir) echo "$T/llvm-mingw/bin" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "$T/shim/llvm-config"
          {
            echo "LLVM_ROOT=$T/llvm-mingw"
            echo "PS5_PAYLOAD_SDK=$T/ps5-payload-sdk"
            echo "LLVM_CONFIG=$T/shim/llvm-config"
          } >> "$GITHUB_ENV"

      - name: Build PS5 payloads
        shell: bash
        run: |
          { cmake --preset ps5 && cmake --build --preset ps5; } 2>&1 | tee -a ci.log

      - name: Build Windows programs
        shell: bash
        run: |
          { cmake --preset windows && cmake --build --preset windows; } 2>&1 | tee -a ci.log

      # One flat folder: the dev build lists every file next to each other.
      - name: Collect binaries
        shell: bash
        run: mkdir -p build/out && cp build/ps5/bin/*.elf build/windows/bin/*.exe build/out/ && ls -l build/out

      - name: No bare syscall stubs of the SDK
        shell: bash
        run: bash .github/scripts/check-raw-syscalls.sh build/ps5 2>&1 | tee -a ci.log

      - name: Failure details as annotation (readable without login)
        if: failure()
        run: bash .github/scripts/annotate-tail.sh ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: build/out/*
          if-no-files-found: error

  ps5-host-test:
    name: ps5-host-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build host variant of the PS5 code
        shell: bash
        run: |
          {
            sudo apt-get update -q &&
            sudo apt-get install -y -q ninja-build smbclient &&
            cmake --preset host &&
            cmake --build --preset host
          } 2>&1 | tee -a ci.log

      - name: S1 probe behaviour (E1)
        shell: bash
        run: bash tests/spikes/s1-host-test.sh build/host/bin/s1-portprobe 2>&1 | tee -a ci.log

      - name: S2 SMB server against smbclient (E1)
        shell: bash
        run: bash tests/spikes/s2-host-test.sh build/host/bin/s2-smbserver 2>&1 | tee -a ci.log

      - name: S3 read-write SMB server against smbclient (E1)
        shell: bash
        run: bash tests/spikes/s3-host-test.sh build/host/bin/s3-smbserver 2>&1 | tee -a ci.log

      - name: S4 throughput server against smbclient (E1)
        shell: bash
        run: bash tests/spikes/s4-host-test.sh build/host/bin/s4-smbserver 2>&1 | tee -a ci.log

      - name: S7 UDP discovery (E1)
        shell: bash
        run: bash tests/spikes/s7-host-test.sh build/host/bin/s7-smbserver 2>&1 | tee -a ci.log

      - name: prospero-smbd against smbclient (E1)
        shell: bash
        run: bash tests/smbd/host-test.sh build/host/bin/prospero-smbd 2>&1 | tee -a ci.log

      - name: State machine of the Windows program (E1)
        shell: bash
        run: build/host/bin/prospero-core-test 2>&1 | tee -a ci.log

      # Static, so the same binaries also run in a minimal WSL 1 rootfs on
      # the Windows runner (spike S6).
      - name: Static host servers for the client tests
        shell: bash
        run: |
          {
            cmake -S . -B build/host-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXE_LINKER_FLAGS=-static &&
            cmake --build build/host-static --target s2-smbserver s3-smbserver s4-smbserver s7-smbserver prospero-smbd
          } 2>&1 | tee -a ci.log

      - name: Failure details as annotation (readable without login)
        if: failure()
        run: bash .github/scripts/annotate-tail.sh ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: host-servers
          path: |
            build/host-static/bin/*-smbserver
            build/host-static/bin/prospero-smbd
          if-no-files-found: error

  # Spike S6 (E2): the real Windows SMB client against the real server
  # code. The server is the static Linux build, run in WSL 1 (Alpine
  # minirootfs, pinned by hash), which shares the network stack with
  # Windows. Windows itself holds port 445, so the server listens on 4450
  # and the client uses /TCPPORT (Server 2025 / Windows 11 24H2).
  #
  # Spike S7 (E2) in the same job: the discovery client against the s7
  # server, unicast over loopback. Whether a firewall prompt appears can
  # only be seen live (E3): the runner is elevated and has no desktop.
  windows-client:
    name: windows-client
    needs: [ps5-build, ps5-host-test]
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      ALPINE_URL: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.6-x86_64.tar.gz
      ALPINE_SHA256: 27694aaa55fd7a9e3ef596e0ad4eb66802308bb20172b17030cd5f4d8ae9bac2
      SMB_PORT: "4450"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: host-servers
          path: host-servers

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries

      - name: Server in WSL 1, S3-Check.cmd and S7 against it (E2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WSL_UTF8 = '1'
          $pw = "ci-" + [guid]::NewGuid().ToString('N').Substring(0,12)
          function Start-Server($spike, $port, $log) {
            Start-Process -FilePath wsl.exe -WindowStyle Hidden `
              -ArgumentList '-d','ci','-u','root','--',"/root/$spike-smbserver",'/root/base',$port,$pw `
              -RedirectStandardOutput "$log.log" -RedirectStandardError "$log.err"
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep 1
              $status = curl.exe -fsS --max-time 3 http://127.0.0.1:4445/ 2>$null
              if ($status | Select-String '^folder=/') { return $status }
            }
            throw "$spike server did not answer on 4445"
          }
          & {
            wsl --version
            curl.exe -fsSL -o alpine.tar.gz $env:ALPINE_URL
            $sha = (Get-FileHash alpine.tar.gz -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $env:ALPINE_SHA256) { throw "alpine rootfs hash $sha" }
            wsl --import ci C:\wsl-ci alpine.tar.gz --version 1
            if ($LASTEXITCODE) { throw "wsl --import failed: $LASTEXITCODE" }
            wsl -l -v
            $src = '/mnt/' + $env:GITHUB_WORKSPACE.Substring(0,1).ToLower() + ($env:GITHUB_WORKSPACE.Substring(2) -replace '\\','/') + '/host-servers'
            wsl -d ci -u root -- sh -c "mkdir -p /root/base && cp $src/s3-smbserver $src/s7-smbserver $src/prospero-smbd /root/ && chmod +x /root/*-smbserver /root/prospero-smbd && ls -l /root"
            if ($LASTEXITCODE) { throw "copy into WSL failed: $LASTEXITCODE" }
            Add-Content C:\Windows\System32\drivers\etc\hosts "`n127.0.0.1 prosperotest"
            Start-Server s3 $env:SMB_PORT server
            Get-SmbClientConfiguration | Format-List RequireSecuritySignature, EnableInsecureGuestLogons
            "status via the alias prosperotest:"
            curl.exe -sS --max-time 3 http://prosperotest:4445/ | Select-Object -First 2
          } *>&1 | Tee-Object -FilePath ci.log -Append

          # Same step on purpose: the runner may end processes a step leaves
          # behind, and the server must outlive the check.
          $env:PROSPERO_PW = $pw
          $env:PROSPERO_AUTO = '1'
          $env:PROSPERO_SMB_PORT = $env:SMB_PORT
          cmd /c "tests\spikes\S3-Check.cmd prosperotest > s6.log 2>&1"
          $rc = $LASTEXITCODE
          Get-Content s6.log

          # S7: unicast must work; broadcast over loopback is only reported.
          curl.exe -s --max-time 3 http://127.0.0.1:4445/quit | Out-Null
          Start-Sleep 3
          & {
            Start-Server s7 4451 s7server | Select-Object -First 1
            .\binaries\prospero-s7-discover.exe 127.0.0.1 --unicast-only
            "exit code unicast: $LASTEXITCODE"
            .\binaries\prospero-s7-discover.exe
            "exit code broadcast (reported only): $LASTEXITCODE"
            curl.exe -fsS --max-time 3 http://127.0.0.1:4445/ | Select-String '^discovery_'
          } *>&1 | Tee-Object -FilePath s7.log
          if (-not (Select-String -Quiet -Path s7.log -Pattern '^S7-UNICAST: OK')) {
            "S7 unicast failed"
            if ($rc -eq 0) { $rc = 1 }
          }

          # P2.1: the product server prospero-smbd, share prospero on a scratch
          # root. A new instance quits the s7 server by itself. Writes only
          # into a new test folder.
          & {
            wsl -d ci -u root -- sh -c "mkdir -p /root/smbroot"
            Start-Process -FilePath wsl.exe -WindowStyle Hidden `
              -ArgumentList '-d','ci','-u','root','--','/root/prospero-smbd','/root/smbroot/','/root/smbd-state',$env:SMB_PORT `
              -RedirectStandardOutput smbd.log -RedirectStandardError smbd.err
            $up = $false
            for ($i = 0; $i -lt 60 -and -not $up; $i++) {
              Start-Sleep 1
              $up = [bool](curl.exe -fsS --max-time 3 http://127.0.0.1:4445/ 2>$null | Select-String '^PROSPERO-SMBD OK')
            }
            if (-not $up) { throw "prospero-smbd did not answer on 4445" }
            # P2.2: the probe pairs (first run) and then uses the stored
            # credential (second run). The share test needs port 445, so it
            # stays with the smoke below and the live test.
            .\binaries\prospero-probe.exe 127.0.0.1 --no-broadcast
            if ($LASTEXITCODE) { throw "probe run 1 failed: $LASTEXITCODE" }
            .\binaries\prospero-probe.exe 127.0.0.1 --no-broadcast --open-pairing
            if ($LASTEXITCODE) { throw "probe run 2 failed: $LASTEXITCODE" }
            curl.exe -fsS --max-time 3 http://127.0.0.1:4445/ | Select-String '^(paired_pcs|pairing|skew_)'
            $spw = (wsl -d ci -u root -- sed -n 's/^password=//p' /root/smbd-state/config.ini).Trim()
            $share = '\\prosperotest\prospero'
            net use $share $spw /user:prospero /TCPPORT:$env:SMB_PORT
            if ($LASTEXITCODE) { throw "net use failed: $LASTEXITCODE" }
            $t = '_ProsperoAutoDrive_Test_' + (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss') + '-' + (Get-Random -Maximum 99999)
            New-Item -ItemType Directory -Path "$share\$t" | Out-Null
            Set-Content -Path "$share\$t\hello.txt" -Value 'Prospero AutoDrive P2.1' -NoNewline
            $back = Get-Content -Raw -Path "$share\$t\hello.txt"
            $listed = (Get-ChildItem -Name $share) -contains $t
            # P2.4: the load test of the probe over the connection above
            # (alternate port), small, only to see that it runs.
            New-Item -ItemType Directory -Force -Path "$share\data" | Out-Null
            .\binaries\prospero-probe.exe 127.0.0.1 --no-broadcast --share-host prosperotest --load-test data 16
            if ($LASTEXITCODE) { throw "probe load test failed: $LASTEXITCODE" }
            # Idle cost: only that it runs and every PING is answered; the
            # 0.1 % goal is judged live (a shared runner is not idle). The
            # load test ended the connection, and only net use knows the
            # alternate port.
            net use $share $spw /user:prospero /TCPPORT:$env:SMB_PORT
            if ($LASTEXITCODE) { throw "net use (again) failed: $LASTEXITCODE" }
            $idle = .\binaries\prospero-probe.exe 127.0.0.1 --no-broadcast --share-host prosperotest --idle-test 4
            $idle
            if (-not ($idle -match 'Lebenszeichen jede Sekunde: 4 s, PING 4 beantwortet, 0 ohne Antwort')) { throw "probe idle test did not run" }
            curl.exe -fsS --max-time 3 http://127.0.0.1:4445/net
            # P3.2: ProsperoAutoDrive.exe maps the share while the server
            # runs. P: is taken by a subst drive, which must stay untouched,
            # so the drive is O:. Times: up, gone on an orderly end, up again.
            # The mapping rides on the net use above (alternate port).
            $pad = Join-Path $env:RUNNER_TEMP 'pad-state'
            $p_dir = Join-Path $env:RUNNER_TEMP 'subst-p'
            New-Item -ItemType Directory -Force -Path $p_dir | Out-Null
            subst P: $p_dir
            function Wait-Drive([string]$d, [bool]$want, [int]$ms) {
              $sw = [Diagnostics.Stopwatch]::StartNew()
              while ($sw.ElapsedMilliseconds -lt $ms) {
                if ((Test-Path "$d\") -eq $want) { return $sw.ElapsedMilliseconds }
                Start-Sleep -Milliseconds 50
              }
              return -1
            }
            Start-Process -FilePath .\binaries\ProsperoAutoDrive.exe -WindowStyle Hidden `
              -ArgumentList '--ip','127.0.0.1','--share-host','prosperotest','--state-dir',$pad
            $up = Wait-Drive 'O:' $true 10000
            "P3.2 drive up after $up ms"
            $listed_o = Test-Path 'O:\data'
            curl.exe -fsS --max-time 3 http://127.0.0.1:4445/quit
            $gone = Wait-Drive 'O:' $false 10000
            "P3.2 drive gone after $gone ms (orderly end)"
            Start-Process -FilePath wsl.exe -WindowStyle Hidden `
              -ArgumentList '-d','ci','-u','root','--','/root/prospero-smbd','/root/smbroot/','/root/smbd-state',$env:SMB_PORT `
              -RedirectStandardOutput smbd2.log -RedirectStandardError smbd2.err
            # Windows forgets the alternate port once the server is gone
            # (error 53 on the next mapping), so net use tells it again; with
            # port 445 at home this is not needed.
            for ($i = 0; $i -lt 30; $i++) {
              if (curl.exe -fsS --max-time 2 http://127.0.0.1:4445/ 2>$null | Select-String '^PROSPERO-SMBD OK') { break }
              Start-Sleep 1
            }
            net use $share $spw /user:prospero /TCPPORT:$env:SMB_PORT
            $again = Wait-Drive 'O:' $true 10000
            "P3.2 drive up again after $again ms (after net use)"
            .\binaries\ProsperoAutoDrive.exe --stop
            $stopped = -not (Test-Path 'O:\')
            $p_kept = Test-Path 'P:\'
            subst P: /d
            Get-Content (Join-Path $pad 'log.txt')
            if ($up -lt 0) { throw "P3.2: drive did not come" }
            if (-not $listed_o) { throw "P3.2: O:\data not visible" }
            if ($gone -lt 0) { throw "P3.2: drive did not go" }
            if ($again -lt 0) { throw "P3.2: drive did not come back" }
            if (-not $stopped) { throw "P3.2: drive still there after --stop" }
            if (-not $p_kept) { throw "P3.2: the foreign P: was touched" }
            'P3.2: OK'
            net use $share /delete /y
            curl.exe -fsS --max-time 3 http://127.0.0.1:4445/ | Select-String '^(PROSPERO-SMBD|share|connections|files_created|dirs_created)'
            curl.exe -fsS --max-time 3 http://127.0.0.1:4445/quit
            if ($back -ne 'Prospero AutoDrive P2.1') { throw "read back: '$back'" }
            if (-not $listed) { throw "test folder not listed in the root" }
            'SMBD-E2: OK'
          } *>&1 | Tee-Object -FilePath smbd-e2.log
          if (-not (Select-String -Quiet -Path smbd-e2.log -Pattern '^SMBD-E2: OK')) {
            "prospero-smbd E2 smoke failed"
            if ($rc -eq 0) { $rc = 1 }
          }
          exit $rc

      - name: Results as annotation (readable without login)
        if: always()
        shell: bash
        run: |
          [ -f s6.log ] && grep -E '^(OK|FALSCH|FEHLT|INFO|FEHLER|S3-CHECK|unsupported|connection_end|Systemfehler|System error)' s6.log > s6-summary.log || true
          bash .github/scripts/annotate-tail.sh s6-summary.log notice "S3-Check on windows-2025"
          [ -f s7.log ] && bash .github/scripts/annotate-tail.sh s7.log notice "S7 discovery on windows-2025"
          [ -f smbd-e2.log ] && bash .github/scripts/annotate-tail.sh smbd-e2.log notice "prospero-smbd on windows-2025"
          for f in ci.log server.log server.err s6.log s7server.log s7server.err smbd.log smbd.err; do
            [ -f "$f" ] && bash .github/scripts/annotate-tail.sh "$f" warning "$f"
          done
          true

  # Spike S6 (E2): the Linux kernel client (cifs) and a smbtorture subset
  # against the same static server build. The prototype fails many
  # smbtorture subtests; the job fails only if one of the baseline
  # (tests/spikes/smbtorture-pass.txt) stops passing.
  linux-cifs:
    name: linux-cifs
    needs: [ps5-host-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: host-servers
          path: host-servers

      - name: Server and cifs mount
        shell: bash
        run: |
          set -euo pipefail
          {
            sudo apt-get update -q
            sudo apt-get install -y -q cifs-utils samba-testsuite
            sudo modprobe cifs || sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe cifs
            chmod +x host-servers/*
            mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/mnt"
            PW="ci-$RANDOM$RANDOM"
            echo "PW=$PW" >> "$GITHUB_ENV"
            host-servers/s3-smbserver "$RUNNER_TEMP/base" 4450 "$PW" > server.log 2>&1 &
            for _ in $(seq 100); do curl -fsS --max-time 2 http://127.0.0.1:4445/ 2>/dev/null | grep -q '^folder=/' && break; sleep 0.2; done
            sudo mount -t cifs //127.0.0.1/s3 "$RUNNER_TEMP/mnt" \
              -o "port=4450,username=prospero,password=$PW,vers=3.1.1,sign,cache=none,uid=$(id -u),gid=$(id -g)"
            ls -la "$RUNNER_TEMP/mnt" | head
            cd "$RUNNER_TEMP/mnt"
            sha256sum -c --quiet "$GITHUB_WORKSPACE/tests/spikes/s2-expected.sha256"
            echo "cifs read: all SHA-256 OK"
            cd "$GITHUB_WORKSPACE"
            head -c 3000000 /dev/urandom > "$RUNNER_TEMP/x.bin"
            cp "$RUNNER_TEMP/x.bin" "$RUNNER_TEMP/mnt/x.bin"
            cmp "$RUNNER_TEMP/x.bin" "$RUNNER_TEMP/mnt/x.bin"
            echo "cifs write: OK"
            sudo umount "$RUNNER_TEMP/mnt"
          } 2>&1 | tee -a ci.log

      - name: smbtorture subset against the baseline
        shell: bash
        run: bash .github/scripts/smbtorture-subset.sh 4450 "$PW" tests/spikes/smbtorture-pass.txt

      - name: Results as annotation (readable without login)
        if: always()
        shell: bash
        run: |
          [ -f torture.log ] && bash .github/scripts/annotate-tail.sh torture.log notice "smbtorture subset"
          for f in ci.log server.log; do
            [ -f "$f" ] && bash .github/scripts/annotate-tail.sh "$f" warning "$f"
          done
          true

  publish-dev:
    name: publish-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [guards, ps5-build, ps5-host-test, windows-client, linux-cifs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Build info and checksums
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "run=${GITHUB_RUN_ID}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD-INFO.txt
          cd dist
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat BUILD-INFO.txt SHA256SUMS

      # Tag and release are named dev-build, not dev: a tag "dev" next to the
      # branch "dev" would make the name ambiguous in git.
      - name: Replace pre-release "dev-build"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build dist/* \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "dev $(git rev-parse --short HEAD)" \
            --notes "Automatischer, getesteter Build des dev-Branches. Nicht fuer den produktiven Einsatz. Commit ${GITHUB_SHA}"

      # The owner fetches the build anonymously, so check exactly that. Once
      # (run for b13868b) the step succeeded, the tag moved, and the release
      # still stayed invisible, so a draft is published here and reported.
      - name: Check dev-build is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! state=$(gh release view dev-build --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'); then
            echo "::error title=dev-build::release dev-build not found after creating it"
            exit 1
          fi
          echo "::notice title=dev-build::${state}"
          case "$state" in
            draft=true*) gh release edit dev-build --draft=false --prerelease ;;
          esac
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-build/BUILD-INFO.txt"
          for i in $(seq 18); do
            if curl -fsSL "$url" 2>/dev/null | grep -qx "commit=${GITHUB_SHA}"; then
              echo "public download OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=dev-build::BUILD-INFO.txt is not publicly downloadable for ${GITHUB_SHA}"
          exit 1
