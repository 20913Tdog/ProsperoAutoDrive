name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  guards:
    name: guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: No binaries or large files in git
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            # Submodules (third_party/) appear as empty directories here.
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            if [ "$size" -gt 1048576 ]; then
              echo "::error file=$f::larger than 1 MiB ($size bytes) - publish via the dev pre-release instead"
              fail=1
            fi
            [ "$size" -eq 0 ] && continue
            case "$f" in
              *.png|*.ico) continue ;;
            esac
            if [ "$(file -b --mime-encoding "$f")" = "binary" ]; then
              echo "::error file=$f::binary file - build outputs belong in the dev pre-release, not in git"
              fail=1
            fi
          done < <(git ls-files -z)
          exit $fail

  # Same pinned toolchain as local development: llvm-mingw (clang) for PS5 and
  # Windows targets, ps5-payload-sdk for the PS5 sysroot.
  ps5-build:
    name: ps5-build
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20260922"
      LLVM_MINGW_SHA256: bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21
      SDK_VERSION: v0.44
      SDK_SHA256: 4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains
          key: toolchains-llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ps5sdk-${{ env.SDK_VERSION }}

      - name: Download toolchains (pinned versions and hashes)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/toolchains && cd ~/toolchains
          curl -fsSL -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          echo "${LLVM_MINGW_SHA256}  llvm-mingw.tar.xz" | sha256sum -c -
          mkdir llvm-mingw
          tar -xJf llvm-mingw.tar.xz -C llvm-mingw --strip-components=1
          rm llvm-mingw.tar.xz
          curl -fsSL -o ps5-payload-sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          echo "${SDK_SHA256}  ps5-payload-sdk.zip" | sha256sum -c -
          unzip -q ps5-payload-sdk.zip
          rm ps5-payload-sdk.zip

      - name: Toolchain environment
        run: |
          set -euo pipefail
          sudo apt-get install -y -q ninja-build
          T="$HOME/toolchains"
          # The SDK's prospero-lld asks llvm-config where ld.lld lives;
          # llvm-mingw ships no llvm-config, so provide a minimal one.
          mkdir -p "$T/shim"
          cat > "$T/shim/llvm-config" <<EOF
          #!/bin/sh
          case "\$1" in
            --bindir) echo "$T/llvm-mingw/bin" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod +x "$T/shim/llvm-config"
          {
            echo "LLVM_ROOT=$T/llvm-mingw"
            echo "PS5_PAYLOAD_SDK=$T/ps5-payload-sdk"
            echo "LLVM_CONFIG=$T/shim/llvm-config"
          } >> "$GITHUB_ENV"

      - name: Build PS5 payloads
        shell: bash
        run: |
          { cmake --preset ps5 && cmake --build --preset ps5; } 2>&1 | tee -a ci.log

      - name: No bare syscall stubs of the SDK
        shell: bash
        run: bash .github/scripts/check-raw-syscalls.sh build/ps5 2>&1 | tee -a ci.log

      - name: Failure details as annotation (readable without login)
        if: failure()
        run: bash .github/scripts/annotate-tail.sh ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: ps5-payloads
          path: build/ps5/bin/*.elf
          if-no-files-found: error

  ps5-host-test:
    name: ps5-host-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build host variant of the PS5 code
        shell: bash
        run: |
          {
            sudo apt-get update -q &&
            sudo apt-get install -y -q ninja-build smbclient &&
            cmake --preset host &&
            cmake --build --preset host
          } 2>&1 | tee -a ci.log

      - name: S1 probe behaviour (E1)
        shell: bash
        run: bash tests/spikes/s1-host-test.sh build/host/bin/s1-portprobe 2>&1 | tee -a ci.log

      - name: S2 SMB server against smbclient (E1)
        shell: bash
        run: bash tests/spikes/s2-host-test.sh build/host/bin/s2-smbserver 2>&1 | tee -a ci.log

      - name: S3 read-write SMB server against smbclient (E1)
        shell: bash
        run: bash tests/spikes/s3-host-test.sh build/host/bin/s3-smbserver 2>&1 | tee -a ci.log

      - name: S4 throughput server against smbclient (E1)
        shell: bash
        run: bash tests/spikes/s4-host-test.sh build/host/bin/s4-smbserver 2>&1 | tee -a ci.log

      # Static, so the same binaries also run in a minimal WSL 1 rootfs on
      # the Windows runner (spike S6).
      - name: Static host servers for the client tests
        shell: bash
        run: |
          {
            cmake -S . -B build/host-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXE_LINKER_FLAGS=-static &&
            cmake --build build/host-static --target s2-smbserver s3-smbserver s4-smbserver
          } 2>&1 | tee -a ci.log

      - name: Failure details as annotation (readable without login)
        if: failure()
        run: bash .github/scripts/annotate-tail.sh ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: host-servers
          path: build/host-static/bin/*-smbserver
          if-no-files-found: error

  # Spike S6 (E2): the real Windows SMB client against the real server
  # code. The server is the static Linux build, run in WSL 1 (Alpine
  # minirootfs, pinned by hash), which shares the network stack with
  # Windows. Windows itself holds port 445, so the server listens on 4450
  # and the client uses /TCPPORT (Server 2025 / Windows 11 24H2).
  windows-client:
    name: windows-client
    needs: [ps5-host-test]
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      ALPINE_URL: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.6-x86_64.tar.gz
      ALPINE_SHA256: 27694aaa55fd7a9e3ef596e0ad4eb66802308bb20172b17030cd5f4d8ae9bac2
      SMB_PORT: "4450"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: host-servers
          path: host-servers

      - name: WSL 1 with the server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WSL_UTF8 = '1'
          & {
            wsl --version
            curl.exe -fsSL -o alpine.tar.gz $env:ALPINE_URL
            $sha = (Get-FileHash alpine.tar.gz -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $env:ALPINE_SHA256) { throw "alpine rootfs hash $sha" }
            wsl --import ci C:\wsl-ci alpine.tar.gz --version 1
            if ($LASTEXITCODE) { throw "wsl --import failed: $LASTEXITCODE" }
            wsl -l -v
            $src = '/mnt/' + $env:GITHUB_WORKSPACE.Substring(0,1).ToLower() + ($env:GITHUB_WORKSPACE.Substring(2) -replace '\\','/') + '/host-servers'
            wsl -d ci -u root -- sh -c "mkdir -p /root/base && cp $src/s3-smbserver /root/ && chmod +x /root/s3-smbserver && ls -l /root"
            if ($LASTEXITCODE) { throw "copy into WSL failed: $LASTEXITCODE" }
            Add-Content C:\Windows\System32\drivers\etc\hosts "`n127.0.0.1 prosperotest"
            $pw = "ci-" + [guid]::NewGuid().ToString('N').Substring(0,12)
            "PROSPERO_PW=$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            Start-Process -FilePath wsl.exe -ArgumentList '-d','ci','-u','root','--','/root/s3-smbserver','/root/base',$env:SMB_PORT,$pw `
              -RedirectStandardOutput server.log -RedirectStandardError server.err -WindowStyle Hidden
            $ok = $false
            for ($i = 0; $i -lt 120 -and -not $ok; $i++) {
              Start-Sleep 1
              $status = curl.exe -fsS --max-time 3 http://127.0.0.1:4445/ 2>$null
              $ok = [bool]($status | Select-String '^folder=/')
            }
            $status
            if (-not $ok) { throw "server did not answer on 4445" }
            Get-SmbClientConfiguration | Format-List RequireSecuritySignature, EnableInsecureGuestLogons
          } *>&1 | Tee-Object -FilePath ci.log -Append

      - name: S3-Check.cmd against the server (E2)
        shell: cmd
        run: |
          set PROSPERO_AUTO=1
          set PROSPERO_SMB_PORT=%SMB_PORT%
          call tests\spikes\S3-Check.cmd prosperotest > s6.log 2>&1
          set RC=%errorlevel%
          type s6.log
          exit /b %RC%

      - name: Results as annotation (readable without login)
        if: always()
        shell: bash
        run: |
          [ -f s6.log ] && grep -E '^(OK|FALSCH|FEHLT|INFO|FEHLER|S3-CHECK|unsupported|connection_end|Systemfehler|System error)' s6.log > s6-summary.log || true
          bash .github/scripts/annotate-tail.sh s6-summary.log notice "S3-Check on windows-2025"
          for f in ci.log server.log server.err; do
            [ -f "$f" ] && bash .github/scripts/annotate-tail.sh "$f" warning "$f"
          done
          true

  # Spike S6 (E2): the Linux kernel client (cifs) and a smbtorture subset
  # against the same static server build. smbtorture results are reported,
  # not yet enforced: S6 asks whether this can run in CI at all.
  linux-cifs:
    name: linux-cifs
    needs: [ps5-host-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: host-servers
          path: host-servers

      - name: Server and cifs mount
        shell: bash
        run: |
          set -euo pipefail
          {
            sudo apt-get update -q
            sudo apt-get install -y -q cifs-utils samba-testsuite
            sudo modprobe cifs || sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe cifs
            chmod +x host-servers/*
            mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/mnt"
            PW="ci-$RANDOM$RANDOM"
            echo "PW=$PW" >> "$GITHUB_ENV"
            host-servers/s3-smbserver "$RUNNER_TEMP/base" 4450 "$PW" > server.log 2>&1 &
            for _ in $(seq 100); do curl -fsS --max-time 2 http://127.0.0.1:4445/ 2>/dev/null | grep -q '^folder=/' && break; sleep 0.2; done
            sudo mount -t cifs //127.0.0.1/s3 "$RUNNER_TEMP/mnt" \
              -o "port=4450,username=prospero,password=$PW,vers=3.1.1,sign,cache=none,uid=$(id -u),gid=$(id -g)"
            ls -la "$RUNNER_TEMP/mnt" | head
            cd "$RUNNER_TEMP/mnt"
            sha256sum -c --quiet "$GITHUB_WORKSPACE/tests/spikes/s2-expected.sha256"
            echo "cifs read: all SHA-256 OK"
            cd "$GITHUB_WORKSPACE"
            head -c 3000000 /dev/urandom > "$RUNNER_TEMP/x.bin"
            cp "$RUNNER_TEMP/x.bin" "$RUNNER_TEMP/mnt/x.bin"
            cmp "$RUNNER_TEMP/x.bin" "$RUNNER_TEMP/mnt/x.bin"
            echo "cifs write: OK"
            sudo umount "$RUNNER_TEMP/mnt"
          } 2>&1 | tee -a ci.log

      - name: smbtorture subset (reported, not enforced)
        shell: bash
        run: |
          for t in smb2.connect smb2.read smb2.dir smb2.rename smb2.setinfo smb2.getinfo smb2.delete-on-close-perms; do
            if timeout 300 smbtorture //127.0.0.1/s3 -p 4450 -U "prospero%$PW" \
                 --option=ntlmssp_client:force_old_spnego=yes --option=clientsigning=required \
                 "$t" > "torture-$t.log" 2>&1; then r=PASS; else r="FAIL($?)"; fi
            ok=$(grep -c '^success:' "torture-$t.log" || true)
            bad=$(grep -c -E '^(failure|error):' "torture-$t.log" || true)
            echo "$t: $r, $ok success, $bad failure/error" | tee -a torture.log
            grep -E '^(failure|error):' "torture-$t.log" | head -n 8 | sed 's/^/    /' >> torture.log || true
          done
          true

      - name: Results as annotation (readable without login)
        if: always()
        shell: bash
        run: |
          [ -f torture.log ] && bash .github/scripts/annotate-tail.sh torture.log notice "smbtorture subset"
          for f in ci.log server.log; do
            [ -f "$f" ] && bash .github/scripts/annotate-tail.sh "$f" warning "$f"
          done
          true

  publish-dev:
    name: publish-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [guards, ps5-build, ps5-host-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ps5-payloads
          path: dist

      - name: Build info and checksums
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "run=${GITHUB_RUN_ID}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD-INFO.txt
          cd dist
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat BUILD-INFO.txt SHA256SUMS

      # Tag and release are named dev-build, not dev: a tag "dev" next to the
      # branch "dev" would make the name ambiguous in git.
      - name: Replace pre-release "dev-build"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build dist/* \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "dev $(git rev-parse --short HEAD)" \
            --notes "Automatischer, getesteter Build des dev-Branches. Nicht fuer den produktiven Einsatz. Commit ${GITHUB_SHA}"

      # The owner fetches the build anonymously, so check exactly that. Once
      # (run for b13868b) the step succeeded, the tag moved, and the release
      # still stayed invisible, so a draft is published here and reported.
      - name: Check dev-build is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! state=$(gh release view dev-build --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'); then
            echo "::error title=dev-build::release dev-build not found after creating it"
            exit 1
          fi
          echo "::notice title=dev-build::${state}"
          case "$state" in
            draft=true*) gh release edit dev-build --draft=false --prerelease ;;
          esac
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-build/BUILD-INFO.txt"
          for i in $(seq 18); do
            if curl -fsSL "$url" 2>/dev/null | grep -qx "commit=${GITHUB_SHA}"; then
              echo "public download OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=dev-build::BUILD-INFO.txt is not publicly downloadable for ${GITHUB_SHA}"
          exit 1
